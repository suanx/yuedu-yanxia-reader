name: yuedu
description: "檐下 · 阅读 App（发现 / 书架 / 阅读 / 听书），Flutter 安卓端"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  # 听书走自写的 Android 原生 TextToSpeech 通道（MethodChannel），
  # 不依赖 flutter_tts 插件：避免其 Kotlin 2.x stdlib 与 Flutter 3.24
  # 的 Kotlin 编译器版本冲突导致 Gradle 编译失败。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/covers/
