name: Android 构建

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 产物类型
        required: true
        default: apk
        type: choice
        options: [apk, aab]

permissions:
  contents: read

env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: 补全 Android 骨架（gradlew / wrapper jar / settings.gradle）
        run: |
          set -euxo pipefail
          # Flutter 3.24 的 android 模板是 Groovy，且 gradlew / gradle-wrapper.jar
          # 属于生成物、不入库，这里用官方命令在项目根补齐。
          # 先备份定制的构建脚本与 Manifest，避免 flutter create 覆盖。
          BK="$(mktemp -d)"
          cp android/app/build.gradle "$BK/app.gradle"
          cp android/build.gradle "$BK/build.gradle"
          cp android/app/src/main/AndroidManifest.xml "$BK/AndroidManifest.xml"
          flutter create --platforms=android --project-name yuedu \
            --org com.yanxia.reader --no-pub .
          cp "$BK/app.gradle" android/app/build.gradle
          cp "$BK/build.gradle" android/build.gradle
          cp "$BK/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml
          chmod +x android/gradlew
          rm -rf "$BK"
          echo "--- 生成结果 ---"
          ls -l android/gradlew android/gradle/wrapper/gradle-wrapper.jar \
                android/settings.gradle android/app/build.gradle
          echo "--- 不应存在 .kts ---"
          find android -name '*.kts' -print

      - name: 拉依赖
        run: flutter pub get

      - name: 统一代码格式（不阻塞）
        run: dart format . || true

      - name: 静态分析与单测
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --no-pub

      - name: 工程结构校验
        run: |
          test -f pubspec.yaml && echo "pubspec.yaml OK"
          test -f lib/main.dart && echo "lib/main.dart OK"
          grep -q "flutter_tts" pubspec.yaml && echo "flutter_tts OK"
          grep -q "com.yanxia.reader" android/app/build.gradle.kts && echo "applicationId OK"

      - name: 构建 APK（release，带 debug 签名，可直接安装）
        run: flutter build apk --release

      - name: 构建 AAB（手动选 aab 时）
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'aab'
        run: flutter build appbundle --release

      - name: 产物改名
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk yuedu-yanxia.apk
          ls -lh yuedu-yanxia.apk

      - name: 可选：用正式 keystore 重签
        if: >-
          env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' &&
          env.KEY_ALIAS != '' && env.KEY_PASSWORD != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/upload.keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out yuedu-yanxia-signed.apk yuedu-yanxia.apk
          mv yuedu-yanxia-signed.apk yuedu-yanxia.apk
          echo "正式签名已应用"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: yuedu-yanxia
          path: yuedu-yanxia.apk
          if-no-files-found: error
          retention-days: 30

      - name: 构建小结
        run: |
          echo "## 檐下 · Yanxia Reader 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK 带 debug 签名，可直接安装" >> "$GITHUB_STEP_SUMMARY"
          echo "- 下载：本页 Artifacts → yuedu-yanxia" >> "$GITHUB_STEP_SUMMARY"
