name: Android 构建

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 产物类型
        required: true
        default: apk
        type: choice
        options: [apk, aab]

permissions:
  contents: read

env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: 补全 Android 骨架（gradlew / wrapper jar / settings.gradle）
        run: |
          set -euxo pipefail
          # Flutter 3.24 的 android 模板是 Groovy，且 gradlew / gradle-wrapper.jar
          # 属于生成物、不入库，这里用官方命令在项目根补齐。
          # 先备份定制的构建脚本与 Manifest，避免 flutter create 覆盖。
          BK="$(mktemp -d)"
          cp android/app/build.gradle "$BK/app.gradle"
          cp android/build.gradle "$BK/build.gradle"
          cp android/app/src/main/AndroidManifest.xml "$BK/AndroidManifest.xml"
          flutter create --platforms=android --project-name yuedu \
            --org com.yanxia.reader --no-pub .
          cp "$BK/app.gradle" android/app/build.gradle
          cp "$BK/build.gradle" android/build.gradle
          cp "$BK/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml
          chmod +x android/gradlew
          rm -rf "$BK"
          echo "--- 生成结果 ---"
          ls -l android/gradlew android/gradle/wrapper/gradle-wrapper.jar \
                android/settings.gradle android/app/build.gradle
          echo "--- 不应存在 .kts ---"
          find android -name '*.kts' -print

      - name: 拉依赖
        run: flutter pub get

      - name: 统一代码格式（不阻塞）
        run: dart format . || true

      - name: 静态分析与单测
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/analyze.log 2>&1
          A=$?
          flutter test --no-pub > /tmp/test.log 2>&1
          T=$?
          echo "analyze exit=$A  test exit=$T"
          echo "::group::flutter analyze 输出"
          cat /tmp/analyze.log
          echo "::endgroup::"
          echo "::group::flutter test 输出"
          cat /tmp/test.log
          echo "::endgroup::"
          # GitHub 每个 job 只保留前若干条 annotation，所以只发关键行，
          # 且把退出码与 error 行排在最前面。
          if [ "$A" -ne 0 ] || [ "$T" -ne 0 ]; then
            echo "::error::EXIT analyze=$A test=$T"
            {
              grep -E "error •|Error:|error:" /tmp/analyze.log | head -6
              grep -E "FAILED|Exception|Expected:|Actual:|error:" /tmp/test.log | head -6
            } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | while IFS= read -r l; do echo "::error::$l"; done
            echo "::error::ANALYZE_TAIL $(tail -1 /tmp/analyze.log | sed 's/%/%25/g')"
            echo "::error::TEST_TAIL $(tail -1 /tmp/test.log | sed 's/%/%25/g')"
            exit 1
          fi

      - name: 工程结构校验
        run: |
          test -f pubspec.yaml && echo "pubspec.yaml OK"
          test -f lib/main.dart && echo "lib/main.dart OK"
          grep -q "flutter_tts" pubspec.yaml && echo "flutter_tts OK"
          grep -q "com.yanxia.reader" android/app/build.gradle && echo "applicationId OK"

      - name: 构建 APK（release，带 debug 签名，可直接安装）
        run: |
          set +e
          flutter build apk --release > /tmp/build.log 2>&1
          B=$?
          echo "::group::flutter build 输出"
          cat /tmp/build.log
          echo "::endgroup::"
          if [ "$B" -ne 0 ]; then
            echo "::error::BUILD_EXIT=$B"
            CTX=$(awk '/\* What went wrong:/{f=1} f && !/^\* Try:/{print} /^\* Try:/{exit}' /tmp/build.log \
              | head -32 | tr '\n' '¦' | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
            echo "::error::CTX $CTX"
            KL=$(grep -E "^e: |Module was compiled|Unresolved reference|incompatible|Kotlin version|Compilation error|Could not resolve" /tmp/build.log \
              | head -12 | tr '\n' '¦' | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
            echo "::error::KOTLIN $KL"
            END=$(tail -2 /tmp/build.log | tr '\n' '¦' | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
            echo "::error::END $END"
            exit 1
          fi

      - name: 构建 AAB（手动选 aab 时）
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'aab'
        run: flutter build appbundle --release

      - name: 产物改名
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk yuedu-yanxia.apk
          ls -lh yuedu-yanxia.apk

      - name: 可选：用正式 keystore 重签
        if: >-
          env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' &&
          env.KEY_ALIAS != '' && env.KEY_PASSWORD != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/upload.keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out yuedu-yanxia-signed.apk yuedu-yanxia.apk
          mv yuedu-yanxia-signed.apk yuedu-yanxia.apk
          echo "正式签名已应用"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: yuedu-yanxia
          path: yuedu-yanxia.apk
          if-no-files-found: error
          retention-days: 30

      - name: 构建小结
        run: |
          echo "## 檐下 · Yanxia Reader 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK 带 debug 签名，可直接安装" >> "$GITHUB_STEP_SUMMARY"
          echo "- 下载：本页 Artifacts → yuedu-yanxia" >> "$GITHUB_STEP_SUMMARY"
